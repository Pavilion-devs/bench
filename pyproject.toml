[project]
name = "bench"
version = "0.1.0"
description = "Coding agents try out on a team's real tickets, in Switch."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs the Switch dev stack from deploy/ running"]

[tool.uv]
package = false
